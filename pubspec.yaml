name: trading
description: "A TradingView-inspired Flutter trading app with realtime charts, watchlist, and technical indicators."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0-200.1.beta

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  google_sign_in: ^6.2.2

  # Networking
  dio: ^5.8.0+1

  # Charts
  candlesticks: ^2.1.0
  fl_chart: ^0.70.2

  # Navigation
  go_router: ^17.1.0

  # Code generation / serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Storage
  shared_preferences: ^2.3.5

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.7
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  timeago: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  freezed: ^3.0.6
  json_serializable: ^6.9.4
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
